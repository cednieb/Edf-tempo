<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Couleur Tempo</title>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 2em;
  }
  .edf-header {    
    display: flex;
    align-items: center;
    gap: 1em;
    font-size: 1.3em;
    font-weight: bold;
    margin-bottom: 0.2em;
    width: 210px;
  }
  .tempo-date, .tempo-now {  
    color: white;
    font-size: 1em;
    font-weight: bold;
    padding: 1em 1em;
    border-radius: 0.5em;
    width: 210px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    text-align: center;
    margin: 0.5em 0;
  }
</style>
</head>
<body>
  <div class="edf-header">
    <img src="https://www.edf.fr/themes/custom/nova/assets/images/00-tokens/logos/images/logo-edf.svg"
         alt="EDF logo" height="48" style="background:white;border-radius:12px;padding:4px;" />
    <span>Tempo</span>
  </div>

  <div id="now" class="tempo-now">Chargement tarif actuel…</div>
  <div id="today" class="tempo-date">Chargement jour aujourd'hui…</div>
  <div id="tomorrow" class="tempo-date">Chargement jour demain…</div>

  <script>
    const couleurMap = {
      "Bleu": "#228be6",
      "Rouge": "#fa5252",
      "Blanc": "#adb5bd",
      "Bleu-HP": "#228be6",
      "Bleu-HC": "#228be6",
      "Rouge-HP": "#fa5252",
      "Rouge-HC": "#fa5252",
      "Blanc-HP": "#adb5bd",
      "Blanc-HC": "#adb5bd"
    };

    // Capitalize first letter helper
    function capitalizeFirst(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    // Format date to "Mardi 18 novembre 2025"
    function formatDateFrench(isoDate) {
      const dateObj = new Date(isoDate);
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      return capitalizeFirst(dateObj.toLocaleDateString('fr-FR', options));
    }

    function fetchAndRenderTodayTomorrow(endpoint, elementId) {
      fetch(endpoint)
        .then(response => {
          if (!response.ok) throw new Error("Erreur API " + response.status);
          return response.json();
        })
        .then(data => {
          const dateFr = formatDateFrench(data.dateJour);
          const color = couleurMap[data.libCouleur] || "#333";
          const div = document.getElementById(elementId);
          div.textContent = dateFr;
          div.style.backgroundColor = color;
        })
        .catch(error => {
          document.getElementById(elementId).textContent = "Erreur API : " + error.message;
          document.getElementById(elementId).style.backgroundColor = "#333";
        });
    }

    function fetchAndRenderNow() {
      fetch('https://www.api-couleur-tempo.fr/api/now')
        .then(response => {
          if (!response.ok) throw new Error("Erreur API " + response.status);
          return response.json();
        })
        .then(data => {
          const div = document.getElementById('now');
          const color = couleurMap[data.libTarif] || "#555";
          div.textContent = `${data.libTarif} à ${data.tarifKwh} €/kWh`;
          div.style.backgroundColor = color;
        })
        .catch(error => {
          const div = document.getElementById('now');
          div.textContent = "Erreur API : " + error.message;
          div.style.backgroundColor = "#555";
        });
    }

    fetchAndRenderNow();
    fetchAndRenderTodayTomorrow('https://www.api-couleur-tempo.fr/api/jourTempo/today', 'today');
    fetchAndRenderTodayTomorrow('https://www.api-couleur-tempo.fr/api/jourTempo/tomorrow', 'tomorrow');
  </script>
</body>
</html>
